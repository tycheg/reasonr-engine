name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          PATH="$(go env GOPATH)/bin:$PATH" make lint
      - name: test
        run: make test-race
      - name: benchmarks
        run: go test ./internal/testrun -run '^$' -bench . -benchtime 200x -benchmem
      - name: fuzz (short)
        run: make fuzz FUZZTIME=20s
      - name: the reasonr-builder image
        run: make images
